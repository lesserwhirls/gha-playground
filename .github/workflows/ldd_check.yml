on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [
          ubuntu-22.04,
          ubuntu-22.04-arm,
          ubuntu-24.04,
          ubuntu-24.04-arm,
        ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Print ldd version information for ${{ matrix.os }}
        run: ldd --version
